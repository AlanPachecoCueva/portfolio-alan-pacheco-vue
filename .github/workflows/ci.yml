# CI: seguridad de dependencias (DA-008), lint y build estático.
# Las actions van fijadas por SHA para evitar que una etiqueta movida cambie el código que se ejecuta.
name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node (versión de .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # DA-008: altas y críticas bloquean el merge
      - name: Auditoría de dependencias (máximo severidad media)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      # La config pública de Firebase/EmailJS no se necesita para compilar:
      # Firestore y Auth solo se usan en el cliente (process.client).
      - name: Build estático (nuxt generate)
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:ci'
          VITE_EMAILJS_SERVICE_ID: ci-placeholder
          VITE_EMAILJS_TEMPLATE_ID: ci-placeholder
          VITE_EMAILJS_PUBLIC_KEY: ci-placeholder
